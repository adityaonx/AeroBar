      <stop offset="85%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="yt_specular" x1="0" y1="0" x2="0" y2="18" gradientUnits="userSpaceOnUse">
