      <stop offset="50%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <linearGradient id="yt_rim" x1="0" y1="0" x2="0" y2="44" gradientUnits="userSpaceOnUse">
