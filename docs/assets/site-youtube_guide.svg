  <rect x="2" y="2" width="146" height="42" rx="21" fill="url(#yt_bg)" filter="url(#yt_glow)"/>
  <rect x="2.5" y="2.5" width="145" height="41" rx="20.5" stroke="url(#yt_rim)" stroke-width="1"/>
  <path d="M 23 3 L 127 3 Q 146 3 146 22 Q 120 8 75 8 Q 30 8 4 22 Q 4 3 23 3 Z" fill="url(#yt_specular)"/>

