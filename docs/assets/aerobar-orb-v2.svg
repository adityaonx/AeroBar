<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 100 100">
  <defs>
    <!-- Base shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-opacity="0.55" />
    </filter>

    <!-- Base grey gradient -->
    <linearGradient id="baseGrey" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#292929" />
      <stop offset="100%" stop-color="#171717" />
    </linearGradient>

    <!-- Tint glow (Using #0a6cff blue) -->
    <radialGradient id="tintGlow" cx="50%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#0a6cff" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#0a6cff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0a6cff" stop-opacity="0" />
    </radialGradient>

    <!-- Ambient fill -->
    <radialGradient id="ambient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a6cff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0a6cff" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic Rim Shine -->
    <linearGradient id="rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08" />
    </linearGradient>

    <!-- Specular Highlight -->
    <linearGradient id="specular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>

    <!-- Logo Drop Shadow -->
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.2" />
    </filter>

    <!-- Original Logo Mask -->
    <mask id="m">
      <rect x="0" y="0" width="100" height="100" fill="white"/>
      <path d="M 50 38 L 33 88 C 36 76 42 71 50 71 C 58 71 64 76 67 88 Z" fill="black"/>
      <path d="M 38 89 C 38 77 43 71 50 71 C 57 71 62 77 62 89 Z" fill="black"/>
      <path d="M 44 38 L 10 55 L 15 46 L 47 31 Z" fill="black"/>
      <path d="M 56 38 L 90 55 L 85 46 L 53 31 Z" fill="black"/>
    </mask>

    <!-- Clip Path to guarantee nothing bleeds outside the orb -->
    <clipPath id="orbClip">
      <circle cx="50" cy="50" r="46" />
    </clipPath>
  </defs>

  <!-- 1. Base sphere with shadow -->
  <circle cx="50" cy="50" r="46" fill="url(#baseGrey)" filter="url(#shadow)" />

  <!-- 2. Screen blended tint glow -->
  <circle cx="50" cy="50" r="46" fill="url(#tintGlow)" style="mix-blend-mode: screen;" />

  <!-- 3. Ambient fill -->
  <circle cx="50" cy="50" r="46" fill="url(#ambient)" />

  <!-- 4. Edge ring -->
  <circle cx="50" cy="50" r="45.5" fill="none" stroke="url(#rim)" stroke-width="1" />

  <!-- 5. Logo Mark (Scaled and positioned to match containerSize * 0.50) -->
  <g transform="translate(27, 27) scale(0.46)" filter="url(#logoShadow)">
    <path fill="white" mask="url(#m)" d="M 50 8 L 95 92 L 72 92 L 67 80 C 62 68 57 64 50 64 C 43 64 38 68 33 80 L 28 92 L 5 92 Z" />
    <path fill="white" d="M 50 66 L 2 80 L 4 69 L 50 56 Z" />
    <path fill="white" d="M 50 66 L 98 80 L 96 69 L 50 56 Z" />
  </g>

  <!-- 6. Specular Highlight -->
  <ellipse cx="50" cy="24.5" rx="34" ry="16" fill="url(#specular)" clip-path="url(#orbClip)" />

</svg>
