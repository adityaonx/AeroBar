  <g transform="translate(10, 9)">
    <rect x="0" y="0" width="28" height="28" rx="8" fill="url(#tile_bg_wb)"/>
    <rect x="0.5" y="0.5" width="27" height="27" rx="7.5" stroke="url(#tile_rim_wb)" stroke-width="1"/>
    <path d="M 8 1 L 20 1 Q 27 1 27 8 Q 18 5 14 5 Q 10 5 1 8 Q 1 1 8 1 Z" fill="#ffffff" fill-opacity="0.3"/>
    <circle cx="14" cy="14" r="7.5" stroke="#38bdf8" stroke-width="1.4" fill="none"/>
    <ellipse cx="14" cy="14" rx="3.4" ry="7.5" stroke="#38bdf8" stroke-width="1.2" fill="none"/>
    <line x1="6.5" y1="14" x2="21.5" y2="14" stroke="#38bdf8" stroke-width="1.2"/>
  </g>

  <text x="47" y="28" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="14.5" font-weight="600" fill="#ffffff" letter-spacing="-0.2px">Visit Website</text>
