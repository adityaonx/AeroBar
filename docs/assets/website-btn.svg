<svg xmlns="http://www.w3.org/2000/svg" width="158" height="46" viewBox="0 0 158 46" fill="none">
  <defs>
    <linearGradient id="wb_bg" x1="0" y1="0" x2="0" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2c303c"/>
      <stop offset="50%" stop-color="#1b1e27"/>
      <stop offset="100%" stop-color="#12141a"/>
    </linearGradient>
    <linearGradient id="wb_rim" x1="0" y1="0" x2="0" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="wb_specular" x1="0" y1="0" x2="0" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="tile_bg_wb" x1="0" y1="0" x2="0" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="tile_rim_wb" x1="0" y1="0" x2="0" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="wb_glow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect x="2" y="2" width="154" height="42" rx="21" fill="url(#wb_bg)" filter="url(#wb_glow)"/>
  <rect x="2.5" y="2.5" width="153" height="41" rx="20.5" stroke="url(#wb_rim)" stroke-width="1"/>
  <path d="M 23 3 L 135 3 Q 154 3 154 22 Q 128 8 79 8 Q 30 8 4 22 Q 4 3 23 3 Z" fill="url(#wb_specular)"/>

