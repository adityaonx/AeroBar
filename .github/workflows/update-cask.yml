name: Update Cask on Release

on:
  release:
    types: [published]

jobs:
  update-cask:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get Release Version
        id: get_version
        run: |
          # Strip 'v' prefix if it exists in the tag name
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Update Cask file
        run: |
          sed -i '' -E "s/version \".*\"/version \"${{ env.VERSION }}\"/g" Casks/aerobar.rb
          
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/aerobar.rb
          # Only commit if there are changes
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: bump cask version to ${{ env.VERSION }}"
            git push origin HEAD:main
          else
            echo "No changes to commit"
          fi
